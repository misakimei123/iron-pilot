name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Verify format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Validate metadata
        run: cargo metadata --locked --no-deps --format-version 1

  supply-chain:
    name: License and advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install pinned cargo-deny binary
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/cargo-deny.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.4/cargo-deny-0.19.4-x86_64-unknown-linux-musl.tar.gz
          echo "3bd58b784e83715b86ddbc9deac591890372ec77fda5741bb0826970b958506f  ${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" \
            --strip-components=1 \
            cargo-deny-0.19.4-x86_64-unknown-linux-musl/cargo-deny

      - name: Check licenses, advisories, bans, features and sources
        run: '"${RUNNER_TEMP}/cargo-deny" check'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks binary
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks

      - name: Scan repository history
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --no-banner'
