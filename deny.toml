[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "deny"
allow = []
allow-workspace = true
deny = []
# SQLx 0.9's proc-macro graph still spans these upstream major-version
# transitions. Keep the duplicate exceptions version-pinned and remove them
# when SQLx converges on one version.
skip = [
    { crate = "hashbrown@0.16.1", reason = "SQLx 0.9 also requires hashbrown 0.17 through a separate internal path" },
    { crate = "syn@2.0.119", reason = "SQLx 0.9 macros use syn 2 while current Serde and thiserror derives use syn 3" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 uses the older Windows bindings while Tokio and SQLx use windows-sys 0.61" },
]
skip-tree = []

# `serde`'s derive feature necessarily activates the proc-macro crate's empty
# default feature. Keep the allowance version-pinned and exact.
[[bans.features]]
crate = "serde_derive@1.0.229"
allow = ["default"]
exact = true

# `proptest`'s `std` feature activates regex-syntax's documented default Unicode
# parser set. This is test-only and the exact list prevents silent feature drift.
[[bans.features]]
crate = "regex-syntax@0.8.11"
allow = [
    "default",
    "std",
    "unicode",
    "unicode-age",
    "unicode-bool",
    "unicode-case",
    "unicode-gencat",
    "unicode-perl",
    "unicode-script",
    "unicode-segment",
]
exact = true

# `noyalib`'s minimal parser profile uses these collection and scanning crates
# with their standard-library defaults. Keep the transitive set exact.
[[bans.features]]
crate = "indexmap@2.14.0"
allow = ["default", "serde", "std"]
exact = true

[[bans.features]]
crate = "memchr@2.8.3"
allow = ["alloc", "default", "std"]
exact = true

# `sysinfo`'s Windows process sampler selects the upstream Windows API crates'
# standard feature plus the exact process/memory/CPU surface it calls.
[[bans.features]]
crate = "ntapi@0.4.3"
allow = ["default", "user"]
exact = true

[[bans.features]]
crate = "windows@0.62.2"
allow = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Wdk_System_Threading",
