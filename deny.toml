[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs@1.0.9" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@0.26.11" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "deny"
allow = []
allow-workspace = true
deny = []
# SQLx 0.9's proc-macro graph still spans these upstream major-version
# transitions. Keep the duplicate exceptions version-pinned and remove them
# when SQLx converges on one version.
skip = [
    { crate = "block-buffer@0.12.1", reason = "Tungstenite 0.30 uses digest 0.11 while SHA-2 and SQLx still use digest 0.10" },
    { crate = "cpufeatures@0.3.0", reason = "Tungstenite's SHA-1 0.11 graph uses cpufeatures 0.3 while SHA-2 uses 0.2" },
    { crate = "crypto-common@0.2.2", reason = "Tungstenite's digest 0.11 graph uses crypto-common 0.2 while SHA-2 uses 0.1" },
    { crate = "digest@0.11.3", reason = "Tungstenite's SHA-1 implementation uses digest 0.11 while SHA-2 and SQLx use digest 0.10" },
    { crate = "getrandom@0.4.3", reason = "Tungstenite's rand 0.10 graph uses getrandom 0.4 while existing runtime and test graphs use older releases" },
    { crate = "hashbrown@0.16.1", reason = "SQLx 0.9 also requires hashbrown 0.17 through a separate internal path" },
    { crate = "r-efi@5.3.0", reason = "async-openai and proptest use getrandom 0.3 while the newer runtime graph uses getrandom 0.4" },
    { crate = "rand@0.9.5", reason = "async-openai and proptest use rand 0.9 while Tokio-Tungstenite 0.30 uses rand 0.10" },
    { crate = "rand_core@0.9.5", reason = "async-openai and proptest use rand_core 0.9 while Tokio-Tungstenite 0.30 uses rand_core 0.10" },
    { crate = "syn@2.0.119", reason = "SQLx 0.9 macros use syn 2 while current Serde and thiserror derives use syn 3" },
]
skip-tree = []

# `serde`'s derive feature necessarily activates the proc-macro crate's empty
# default feature. Keep the allowance version-pinned and exact.
[[bans.features]]
crate = "serde_derive@1.0.229"
allow = ["default"]
exact = true

# `proptest`'s `std` feature activates regex-syntax's documented default Unicode
# parser set. This is test-only and the exact list prevents silent feature drift.
[[bans.features]]
crate = "regex-syntax@0.8.11"
allow = [
    "default",
    "std",
    "unicode",
    "unicode-age",
    "unicode-bool",
    "unicode-case",
    "unicode-gencat",
    "unicode-perl",
    "unicode-script",
    "unicode-segment",
]
exact = true

# `noyalib`'s minimal parser profile uses these collection and scanning crates
# with their standard-library defaults. Keep the transitive set exact.
[[bans.features]]
crate = "indexmap@2.14.0"
allow = ["default", "serde", "std"]
exact = true

[[bans.features]]
crate = "memchr@2.8.3"
allow = ["alloc", "default", "std"]
exact = true

