[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []
unused-allowed-license = "allow"

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "deny"
allow = []
allow-workspace = true
deny = []
skip = []
skip-tree = []

# `serde`'s derive feature necessarily activates the proc-macro crate's empty
# default feature. Keep the allowance version-pinned and exact.
[[bans.features]]
crate = "serde_derive@1.0.229"
allow = ["default"]
exact = true

# `proptest`'s `std` feature activates regex-syntax's documented default Unicode
# parser set. This is test-only and the exact list prevents silent feature drift.
[[bans.features]]
crate = "regex-syntax@0.8.11"
allow = [
    "default",
    "std",
    "unicode",
    "unicode-age",
    "unicode-bool",
    "unicode-case",
    "unicode-gencat",
    "unicode-perl",
    "unicode-script",
    "unicode-segment",
]
exact = true

# `noyalib`'s minimal parser profile uses these collection and scanning crates
# with their standard-library defaults. Keep the transitive set exact.
[[bans.features]]
crate = "indexmap@2.14.0"
allow = ["default", "serde", "std"]
exact = true

[[bans.features]]
crate = "memchr@2.8.3"
allow = ["alloc", "default", "std"]
exact = true

[[bans.features]]
crate = "rustc-hash@2.1.3"
allow = ["default", "std"]
exact = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
