[package]
name = "ironpilot-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ironpilot-application = { version = "0.1.0", path = "../ironpilot-application" }
ironpilot-domain = { version = "0.1.0", path = "../ironpilot-domain" }
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
noyalib = { version = "0.0.16", default-features = false, features = ["minimal"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
rust_decimal = { version = "1.42.1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.49.0", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1.24.0", default-features = false, features = ["std", "v4"] }

[dev-dependencies]
tokio = { version = "1.49.0", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
