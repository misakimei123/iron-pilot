[package]
name = "ironpilot-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ironpilot-domain = { version = "0.1.0", path = "../ironpilot-domain" }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false }
tokio = { version = "1.49.0", default-features = false, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.49.0", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
